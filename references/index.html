<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI References</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --line: #dcd8d0; --text: #1c1b19; --muted: #6d685f;
  --accent: #d6336c; --accent2: #1c7ed6; --chip: #ebe7df; --shadow: 0 1px 2px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --panel: #1a1a1f; --line: #2c2c33; --text: #ecebe8; --muted: #9a978f;
    --accent: #ff6b9d; --accent2: #5cb8ff; --chip: #25252c; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111114; --panel: #1a1a1f; --line: #2c2c33; --text: #ecebe8; --muted: #9a978f;
  --accent: #ff6b9d; --accent2: #5cb8ff; --chip: #25252c; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; max-width: 1800px; margin: 0 auto; }
h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: .02em; }
h1 span { color: var(--accent); }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav button, .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
nav button small { color: var(--muted); margin-left: 4px; }
nav button.on small { color: inherit; opacity: .7; }
.tools { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
input[type=search], select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; min-width: 0; }
input[type=search] { width: 240px; max-width: 60vw; }
main { max-width: 1800px; margin: 0 auto; padding: 12px 16px 60px; }
.meta { color: var(--muted); margin: 4px 0 12px; }
.group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
.group h2 b { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.grid.big { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.card .img { aspect-ratio: 16/10; background: var(--chip); position: relative; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; height: 100%; }
.card .pair img { height: 100%; }
.card .tag { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 3px; }
.card .cap { padding: 6px 8px 8px; font-size: 12px; }
.card .cap b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cap span { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { margin: 14px 0; }
#lb { position: fixed; inset: 0; background: rgba(8,8,10,.94); z-index: 20; display: none; flex-direction: column; color: #eee; }
#lb.on { display: flex; }
#lb .top { display: flex; gap: 10px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
#lb .top .t { font-weight: 600; flex: 1; min-width: 200px; }
#lb .top a, #lb .top button { color: #eee; background: #26262c; border: 1px solid #3a3a42; border-radius: 6px; padding: 5px 10px; text-decoration: none; font: inherit; cursor: pointer; }
#lb .stage { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 0 16px 16px; }
#lb .stage.zoom { align-items: flex-start; justify-content: flex-start; }
#lb img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
#lb .stage.zoom img { max-width: none; max-height: none; cursor: zoom-out; }
#lb .info { padding: 0 16px 12px; color: #aaa; font-size: 12px; }
.doc { max-width: 900px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 26px; }
.doc h1 { font-size: 22px; margin: 0 0 10px; }
.doc h2 { font-size: 17px; margin: 26px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.doc h3 { font-size: 14px; margin: 18px 0 6px; }
.doc table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; }
.doc td, .doc th { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.doc code { background: var(--chip); padding: 1px 4px; border-radius: 3px; }
.doc a { color: var(--accent2); word-break: break-all; }
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 16px; max-width: 1400px; }
.lists details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.lists summary { cursor: pointer; font-weight: 600; }
.lists ul { margin: 6px 0 0; padding-left: 18px; font-size: 12px; columns: 2; }
@media (max-width: 640px) {
  .grid, .grid.big { grid-template-columns: repeat(2, 1fr); }
  .tools { margin-left: 0; width: 100%; }
  input[type=search] { flex: 1; width: auto; }
  .lists ul { columns: 1; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>GTA VI <span>References</span></h1>
    <nav id="tabs"></nav>
    <div class="tools">
      <select id="grp"></select>
      <input id="q" type="search" placeholder="Search names, tags, addresses">
      <button class="chip" id="theme" title="Toggle theme">◐</button>
    </div>
  </div>
</header>
<main id="main"></main>
<div id="lb">
  <div class="top">
    <div class="t" id="lbt"></div>
    <button id="lbswap" hidden>Switch in-game / real life</button>
    <a id="lbmap" target="_blank" hidden>Open on map.gtadb.org</a>
    <a id="lbgm" target="_blank" hidden>Real-life location</a>
    <a id="lbopen" target="_blank">Open file</a>
    <button id="lbprev">←</button><button id="lbnext">→</button>
    <button id="lbx">Close (Esc)</button>
  </div>
  <div class="stage" id="stage"><img id="lbimg" alt=""></div>
  <div class="info" id="lbi"></div>
</div>
<script src="catalog.js"></script>
<script>
const C = window.CATALOG || [];
const SECTIONS = [
  ["official", "Official Rockstar"], ["maps", "Maps"], ["landmarks", "Landmarks IG vs RL"],
  ["trailers", "Trailer frames"], ["vehicles", "Vehicles & weapons"], ["details", "Buildings, brands, signs"], ["info", "Game info"]
];
const PAGE = 240;
let state = { s: "official", g: "", q: "", shown: PAGE };
let view = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
};

function counts() { const c = {}; C.forEach(i => c[i.s] = (c[i.s] || 0) + 1); return c; }
function renderTabs() {
  const c = counts();
  $("tabs").innerHTML = SECTIONS.map(([k, l]) => `<button data-k="${k}" class="${state.s === k ? "on" : ""}">${l}${c[k] ? `<small>${c[k]}</small>` : ""}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { state = { s: b.dataset.k, g: "", q: $("q").value, shown: PAGE }; readHash(false); render(); });
}
function groupsFor(s) {
  const c = {}; C.filter(i => i.s === s).forEach(i => c[i.g] = (c[i.g] || 0) + 1);
  let g = Object.entries(c);
  if (s === "landmarks") g.sort((a, b) => b[1] - a[1]);
  return g;
}
function renderGroupSelect() {
  const sel = $("grp");
  if (state.s === "info") { sel.hidden = true; return; }
  sel.hidden = false;
  sel.innerHTML = `<option value="">All groups</option>` + groupsFor(state.s).map(([g, n]) => `<option value="${esc(g)}" ${g === state.g ? "selected" : ""}>${esc(g)} (${n})</option>`).join("");
}
function match(i, q) {
  if (!q) return true;
  const hay = [i.n, i.g, i.rl, i.tags, i.id, i.src, i.f].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function card(i, idx) {
  let img;
  if (i.s === "landmarks" && i.igt && i.rpt) {
    img = `<div class="pair"><img loading="lazy" src="${esc(i.igt)}" alt=""><img loading="lazy" src="${esc(i.rpt)}" alt=""></div><div class="tag">${esc(i.id)} · IG | RL</div>`;
  } else {
    img = `<img loading="lazy" src="${esc(i.t)}" alt="">` + (i.s === "landmarks" ? `<div class="tag">${esc(i.id)} · ${i.igt ? "IG" : "RL"}</div>` : "");
  }
  const sub = i.s === "landmarks" ? (i.rl || i.tags || "") : (i.src || (i.wh ? i.wh.join("×") : ""));
  return `<div class="card" data-i="${idx}"><div class="img">${img}</div><div class="cap"><b title="${esc(i.n)}">${esc(i.n)}</b><span title="${esc(sub)}">${esc(sub)}</span></div></div>`;
}
function render() {
  renderTabs(); renderGroupSelect();
  writeHash();
  const main = $("main");
  if (state.s === "info") { main.innerHTML = renderInfo(); return; }
  view = C.filter(i => i.s === state.s && (!state.g || i.g === state.g) && match(i, state.q));
  const big = state.s === "maps" || state.s === "official";
  const slice = view.slice(0, state.shown);
  const byG = [];
  slice.forEach((i, k) => { let last = byG[byG.length - 1]; if (!last || last.g !== i.g) byG.push(last = { g: i.g, items: [] }); last.items.push([i, k]); });
  const total = {}; view.forEach(i => total[i.g] = (total[i.g] || 0) + 1);
  main.innerHTML = `<div class="meta">${view.length} images${state.q ? ` matching “${esc(state.q)}”` : ""}${intro()}</div>` +
    byG.map(b => `<section class="group"><h2><b>${esc(b.g)}</b> · ${total[b.g]}</h2><div class="grid ${big ? "big" : ""}">${b.items.map(([i, k]) => card(i, k)).join("")}</div></section>`).join("") +
    (view.length > state.shown ? `<div class="more"><button class="chip" id="more">Show more (${view.length - state.shown} left)</button></div>` : "");
  main.querySelectorAll(".card").forEach(el => el.onclick = () => openLb(+el.dataset.i));
  const m = $("more"); if (m) m.onclick = () => { state.shown += PAGE * 2; render(); };
}
function intro() {
  return {
    official: " · 3840×2160 originals from rockstargames.com/VI",
    maps: " · stitched from gtadb.org tiles (CC BY 4.0). Area crops are 1 pixel per game unit, about 1 m",
    landmarks: " · gtadb.org landmark photos: in-game (left) next to the real-world building (right)",
    trailers: " · frames from Trailer 1, Trailer 2 and gtadb guessr",
    vehicles: " · GTA Wiki crops from trailers and screenshots",
    details: " · GTA Wiki crops of storefronts, logos, signage and props",
  }[state.s] || "";
}
let cur = -1, side = "ig";
function lbShow() {
  const i = view[cur]; if (!i) return;
  let src = i.f;
  if (i.s === "landmarks") src = (side === "rl" && i.rp) ? i.rp : (i.ig || i.rp);
  $("lbimg").src = src; $("stage").classList.remove("zoom");
  $("lbt").textContent = (i.id ? i.id + " · " : "") + i.n;
  $("lbopen").href = src;
  $("lbswap").hidden = !(i.ig && i.rp);
  $("lbmap").hidden = !i.id; if (i.id) $("lbmap").href = `https://map.gtadb.org/#VI,${i.id}`;
  $("lbgm").hidden = !i.ll; if (i.ll) $("lbgm").href = `https://www.google.com/maps/search/?api=1&query=${i.ll[0]},${i.ll[1]}`;
  const bits = [];
  if (i.s === "landmarks") { bits.push(side === "rl" && i.rp ? "Real life" : (i.ig ? "In-game" : "Real life")); if (i.rl) bits.push("RL: " + i.rl); if (i.tags) bits.push("Tags: " + i.tags); if (i.xy) bits.push(`Game coords: ${i.xy[0]}, ${i.xy[1]}`); }
  else { bits.push(i.g); if (i.src) bits.push("Source: " + i.src); if (i.wh) bits.push(i.wh.join("×") + " px"); }
  bits.push(src);
  $("lbi").textContent = bits.join("  ·  ");
}
function openLb(k) { cur = k; side = "ig"; $("lb").classList.add("on"); lbShow(); }
function closeLb() { $("lb").classList.remove("on"); $("lbimg").src = ""; }
$("lbx").onclick = closeLb;
$("lbprev").onclick = () => { if (cur > 0) { cur--; side = "ig"; lbShow(); } };
$("lbnext").onclick = () => { if (cur < view.length - 1) { cur++; side = "ig"; lbShow(); } };
$("lbswap").onclick = () => { side = side === "ig" ? "rl" : "ig"; lbShow(); };
$("lbimg").onclick = () => $("stage").classList.toggle("zoom");
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("on")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") $("lbprev").click();
  if (e.key === "ArrowRight") $("lbnext").click();
  if (e.key === " ") { e.preventDefault(); $("lbswap").click(); }
});
$("grp").onchange = e => { state.g = e.target.value; state.shown = PAGE; render(); };
let qt; $("q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); state.shown = PAGE; render(); }, 150); };

function md(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/(https?:\/\/[^\s)|]+)/g, '<a href="$1" target="_blank">$1</a>');
  const lines = src.split("\n"); let out = [], i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`); i++; }
    else if (l.startsWith("|")) {
      const rows = []; while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.slice(1, -1).split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\|[-| ]+\|$/.test(r));
      out.push("<table>" + body.map((r, k) => "<tr>" + cells(r).map(c => k === 0 && rows[1] && /^\|[-| ]+\|$/.test(rows[1]) && body.length > 1 && cells(body[0]).some(x => x) ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</table>");
    }
    else if (l.startsWith("- ")) { const it = []; while (i < lines.length && lines[i].startsWith("- ")) it.push(`<li>${inline(lines[i++].slice(2))}</li>`); out.push(`<ul>${it.join("")}</ul>`); }
    else if (l.trim()) { out.push(`<p>${inline(l)}</p>`); i++; }
    else i++;
  }
  return out.join("");
}
function renderInfo() {
  const L = window.WIKI_LISTS || {};
  const list = (name, arr) => `<details><summary>${esc(name)} (${arr.length})</summary><ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>`;
  let lists = Object.entries(L).filter(([k, v]) => Array.isArray(v)).map(([k, v]) => list(k, v)).join("");
  const locs = L["Locations by area"] || {};
  lists += Object.entries(locs).map(([k, v]) => list("Locations: " + k, v)).join("");
  return `<div class="doc">${md(window.INFO_MD || "")}</div><h2 style="font-size:15px;margin:24px 0 0">Wiki lists</h2><div class="lists">${lists}</div>`;
}
function writeHash() { const h = "#" + [state.s, state.g, state.q].map(encodeURIComponent).join("/"); if (location.hash !== h) history.replaceState(null, "", h); }
function readHash(apply = true) {
  if (!apply) return;
  const [s, g, q] = location.hash.slice(1).split("/").map(x => decodeURIComponent(x || ""));
  if (SECTIONS.some(([k]) => k === s)) { state.s = s; state.g = g || ""; state.q = q || ""; $("q").value = state.q; }
}
readHash(); render();
</script>
</body>
</html>
