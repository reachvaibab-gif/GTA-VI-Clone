name: Build and browser verification
on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/verify.yml']
  pull_request:
    paths: ['game/**', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        run: npm test
      - name: Inspect reference library
        run: node scripts/audit-references.mjs
      - name: Prepare runtime assets
        run: npm run assets
      - name: Typecheck and production build
        run: npm run build
      - name: Install desktop browser
        run: |
          npx playwright install --with-deps chromium
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Browser tests
        timeout-minutes: 7
        env:
          LEONIDA_HEADED: '1'
        run: xvfb-run -a npm run test:browser
      - name: Save bounded evidence in private repository
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-evidence.mjs
