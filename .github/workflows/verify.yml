name: Build and browser verification
on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/verify.yml']
  pull_request:
    paths: ['game/**', '.github/workflows/verify.yml']
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Retain a reproducible Linux verification workspace (requires artifact storage)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        run: npm test
      - name: Inspect reference library
        run: node scripts/audit-references.mjs
      - name: Prepare runtime assets
        run: npm run assets
      - name: Package reproducible verification workspace
        if: github.event_name == 'workflow_dispatch' && inputs.workspace
        working-directory: .
        run: tar -czf "$RUNNER_TEMP/leonida-workspace.tgz" --exclude='game/node_modules/.cache' --exclude='game/evidence' --exclude='game/dist' game
      - name: Retain verification workspace
        if: github.event_name == 'workflow_dispatch' && inputs.workspace
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verification-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/leonida-workspace.tgz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Typecheck and production build
        run: npm run build
      - name: Install desktop browser
        run: |
          npx playwright install --with-deps chromium
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Browser tests
        timeout-minutes: 7
        env:
          LEONIDA_HEADED: '1'
        run: xvfb-run -a npm run test:browser
      - name: Save bounded evidence in private repository
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-evidence.mjs
